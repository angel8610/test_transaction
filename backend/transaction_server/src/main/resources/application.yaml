spring:
  application:
    name: transaction_server

  # H2 Database configuration
  datasource:
    url: ${SERVER_H2_URL}
    driverClassName: org.h2.Driver
    username: ${SERVER_H2_USER}
    password: ${SERVER_H2_PASSWORD}
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    # JPA/Hibernate settings
    hibernate:
      ddl-auto: create
      show-sql: true

server:
  port: 8080
