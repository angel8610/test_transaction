spring:
  application:
    name: transaction_client

server:
  port: 8081

external:
  api:
    transaction:
      url: ${API_TRANSACTION_URL:http://localhost:8080/api/v1/server/transaction}

security:
  encryption:
    algorithm: AES
    transformation: AES/GCM/NoPadding
    key: ${APP_ENCRYPTION_KEY}
